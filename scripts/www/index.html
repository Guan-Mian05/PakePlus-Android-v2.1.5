<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>萝卜笔</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation; /* 优化移动端触摸响应 */
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 1. 背景图容器（支持多图轮播+滑动切换） */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.9);
            transition: transform 0.5s ease; /* 滑动切换过渡动画 */
            opacity: 0;
            z-index: 1;
        }

        .background.active {
            opacity: 1;
            z-index: 2;
        }

        /* 2. 右上角背景音乐开关按钮 */
        .music-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background-image: url("喇叭.png"); /* 开启状态图片 */
            background-size: cover;
            background-position: center;
            cursor: pointer;
            z-index: 4;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .music-switch.off {
            background-image: url("静音.png"); /* 关闭状态图片 */
        }

        /* 3. 右侧录音倍速滑块（自定义图片样式） */
        .speed-control {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .speed-text {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 10px;
        }

        /* 自定义滑块容器（承载背景图片） */
        .slider-wrapper {
            width: 30px;
            height: 175px;
            position: relative;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
		
        /* 新增：伪元素承载滑轨背景图并设置50%透明度 */
        .slider-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("滑轨背景.jpg"); /* 滑轨背景图路径 */
            background-size: cover;
            background-position: center;
            opacity: 0.5; /* 50%透明度，可调整0~1之间的值 */
            border-radius: 15px; /* 与容器圆角一致 */
            z-index: 0; /* 层级低于滑块按钮和原生滑块，不遮挡交互 */
        }		

        /* 隐藏原生滑块，仅用其实现拖动逻辑 */
        .speed-slider {
            width: 100%;
            height: 100%;
            -webkit-appearance: slider-vertical;
            appearance: slider-vertical;
            opacity: 0; /* 透明隐藏 */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 自定义滑块按钮（图片样式） */
        .slider-thumb {
            width: 25px;
            height: 25px;
            background-image: url("胡萝卜.png"); /* 滑块按钮图片 */
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            position: absolute;
            z-index: 2;
            pointer-events: none; /* 不拦截原生滑块事件 */
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* 4. 底部音频按钮（图片样式） */
        .audio-buttons {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 3;
        }

        .audio-btn {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
			background-color: transparent; /*按钮背景透明*/
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #btn1 {
            background-image: url("萝卜左.png"); /* 按钮1图片 */
        }

        #btn2 {
            background-image: url("萝卜中.png"); /* 按钮2图片 */
        }

        #btn3 {
            background-image: url("萝卜右.png"); /* 按钮3图片 */
        }

        .audio-btn:active {
            transform: translateY(4px);
            opacity: 0.8;
        }

        /* 修复：视频弹窗样式（仅包裹视频，无全屏黑背景） */
        .video-popup {
            position: fixed;
            top: 50%;          /* 垂直居中基准 */
            left: 0;           /* 左贴屏幕 */
            right: 0;          /* 右贴屏幕 → 强制宽度100vw */
            transform: translateY(-50%); /* 仅垂直居中，水平无需调整 */
            width: 100vw !important; /* 兜底强制全屏宽度 */
            height: auto;
            z-index: 9999;
            display: none;
            padding: 0 !important;
            margin: 0 !important;
            box-sizing: border-box !important;
            background: transparent !important; /* 彻底消除黑背景 */
        }

        .video-player {
            width: 100% !important; /* 宽度100%填充弹窗（即屏幕宽度） */
            height: auto !important; /* 高度按视频比例自动计算，不拉伸 */
            border: none !important;
            outline: none !important;
            object-fit: contain; /* 完整显示视频，不裁剪；如需全屏裁剪用 cover */
            display: block !important;
            background: transparent !important; /* 视频标签自身背景透明 */
        }

        /* 响应式适配（移除视频弹窗的错误宽度限制） */
        /* 响应式适配：保持原有按钮/滑块适配，删除视频的多余限制 */
        @media (max-width: 320px) {
            .audio-btn {
                width: 70px;
                height: 70px;
            }
            .slider-wrapper {
                height: 180px;
            }
            .music-switch {
                width: 40px;
                height: 40px;
            }
        }

        @media (min-width: 400px) {
            .slider-wrapper {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- 1. 多背景图容器 -->
    <div class="background-container" id="bgContainer"></div>

    <!-- 新增：中间视频弹窗容器 -->
    <div class="video-popup" id="videoPopup">
        <video id="videoPlayer" class="video-player" playsinline></video>
    </div>

    <!-- 2. 右上角背景音乐开关 -->
    <button class="music-switch" id="musicSwitch"></button>

    <!-- 3. 右侧录音倍速控制（自定义图片滑块） -->
    <div class="speed-control">
        <div class="speed-text" id="speedText">1.0x</div>
        <div class="slider-wrapper">
            <input 
                type="range" 
                class="speed-slider" 
                id="speedSlider"
                min="0.1" 
                max="10" 
                step="0.1" 
                value="1"
            >
            <div class="slider-thumb" id="sliderThumb"></div>
        </div>
    </div>

    <!-- 4. 底部音频按钮 -->
    <div class="audio-buttons">
        <button class="audio-btn" id="btn1"></button>
        <button class="audio-btn" id="btn2"></button>
        <button class="audio-btn" id="btn3"></button>
    </div>

    <script>
        // ===================== 全局配置 =====================
        // 1. 背景图配置
        const bgImages = [
            "背景 (1).jpg", "背景 (2).jpg", "背景 (3).png", "背景 (4).png", "背景 (5).png",
            "背景 (6).png", "背景 (7).png", "背景 (8).png", "背景 (9).png", "背景 (10).png",
            "背景 (11).png", "背景 (12).png", "背景 (13).png", "背景 (14).png", "背景 (15).png",
			"背景 (17).png", "背景 (18).png", "背景 (19).png", "背景 (20).png", "背景 (21).png",
			"背景 (22).png", "背景 (23).png", "背景 (24).png", "背景 (25).jpg", "背景 (26).png",
			"背景 (27).png", "背景 (28).jpg", "背景 (29).png", "背景 (30).png", "背景 (31).png",
			"背景 (16).png", "背景 (32).png", "背景 (33).png", "背景 (34).png", "背景 (35).png",
			"背景 (36).png","背景 (37).jpg"
        ];
        let currentBgIndex = 0; // 当前背景图索引
        let bgTimer = null; // 背景轮播定时器

        // 2. 音频配置
        const audio1 = new Audio("1.mp3");
        const audio2 = new Audio("2.mp3");
        const audio3 = new Audio("3.mp3");
        const recordAudios = [audio1, audio2, audio3]; 
        // 背景音乐
        const bgMusic = new Audio("Zoo.mp3");
        bgMusic.loop = true; 
        const defaultBgVolume = 0.6; 
        const lowBgVolume = 0.1; 

        // 视频配置
        const videoPopup = document.getElementById("videoPopup");
        const videoPlayer = document.getElementById("videoPlayer");
        const videoSrc = "shipin.mp4"; 
        const videoVolume = 0.15; 

        // 3. DOM元素获取
        const bgContainer = document.getElementById("bgContainer");
        const musicSwitch = document.getElementById("musicSwitch");
        const speedSlider = document.getElementById("speedSlider");
        const speedText = document.getElementById("speedText");
        const sliderThumb = document.getElementById("sliderThumb");
        const btn1 = document.getElementById("btn1");
        const btn2 = document.getElementById("btn2");
        const btn3 = document.getElementById("btn3");

        // ===================== 背景图相关功能 =====================
        function initBgImages() {
            bgImages.forEach((imgSrc, index) => {
                const bgDiv = document.createElement("div");
                bgDiv.className = "background";
                bgDiv.style.backgroundImage = `url("${imgSrc}")`;
                if (index === currentBgIndex) {
                    bgDiv.classList.add("active");
                }
                bgContainer.appendChild(bgDiv);
            });
        }

        function switchBg(targetIndex) {
            if (targetIndex < 0) {
                targetIndex = bgImages.length - 1;
            } else if (targetIndex >= bgImages.length) {
                targetIndex = 0;
            }
            const allBgs = document.querySelectorAll(".background");
            allBgs[currentBgIndex].classList.remove("active");
            allBgs[targetIndex].classList.add("active");
            currentBgIndex = targetIndex;
        }

        function startBgAutoPlay() {
            if (bgTimer) clearInterval(bgTimer);
            bgTimer = setInterval(() => {
                switchBg(currentBgIndex + 1);
            }, 3000); 
        }

        function initBgSwipe() {
            let startX = 0;
            let endX = 0;
            bgContainer.addEventListener("touchstart", (e) => {
                startX = e.touches[0].clientX;
                if (bgTimer) clearInterval(bgTimer);
            });
            bgContainer.addEventListener("touchmove", (e) => {
                endX = e.touches[0].clientX;
            });
            bgContainer.addEventListener("touchend", () => {
                const swipeDistance = startX - endX;
                if (swipeDistance > 50) {
                    switchBg(currentBgIndex + 1);
                } else if (swipeDistance < -50) {
                    switchBg(currentBgIndex - 1);
                }
                startBgAutoPlay();
            });
        }

        // ===================== 音频相关功能 =====================
        function initRecordAudios() {
            recordAudios.forEach(audio => {
                audio.playbackRate = 1.0;
                audio.addEventListener("ended", () => {
                    bgMusic.volume = defaultBgVolume;
                });
            });
        }

        function initBgMusic() {
            window.addEventListener("load", () => {
                playBgMusic().catch(err => {
                    console.log("背景音乐自动播放失败：", err);
                    document.addEventListener("click", () => {
                        playBgMusic().catch(err => console.log("背景音乐播放失败：", err));
                    }, { once: true });
                });
            });
            musicSwitch.addEventListener("click", () => {
                if (bgMusic.paused) {
                    playBgMusic();
                    musicSwitch.classList.remove("off");
                } else {
                    bgMusic.pause();
                    musicSwitch.classList.add("off");
                }
            });
        }

        function playBgMusic() {
            bgMusic.volume = defaultBgVolume;
            return bgMusic.play();
        }

        function playRecordAudio(targetAudio) {
            recordAudios.forEach(audio => {
                if (audio !== targetAudio) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
            bgMusic.volume = lowBgVolume;
            targetAudio.currentTime = 0;
            targetAudio.play().catch(err => {
                console.error("录音播放失败：", err);
                alert("录音加载失败，请检查文件路径或格式！");
                bgMusic.volume = defaultBgVolume;
            });
        }

        // 初始化视频配置
        function initVideo() {
            videoPlayer.src = videoSrc;
            videoPlayer.volume = videoVolume;
            videoPlayer.addEventListener("ended", () => {
                videoPopup.style.display = "none";
                videoPlayer.pause();
                videoPlayer.currentTime = 0;
            });
            videoPlayer.addEventListener("error", () => {
                alert("视频加载失败，请检查文件路径或格式！");
                videoPopup.style.display = "none";
            });
        }

        // ===================== 自定义滑块功能 =====================
        function syncSliderThumb() {
            const min = parseFloat(speedSlider.min);
            const max = parseFloat(speedSlider.max);
            const value = parseFloat(speedSlider.value);
            const percentage = (max - value) / (max - min);
            sliderThumb.style.top = `${percentage * 100}%`;
            const currentSpeed = value.toFixed(1);
            speedText.textContent = `${currentSpeed}x`;
            recordAudios.forEach(audio => {
                audio.playbackRate = parseFloat(currentSpeed);
            });
        }

        // ===================== 按钮点击事件 =====================
        function initButtons() {
            btn1.addEventListener("click", () => {
                playRecordAudio(audio1);
            });
            btn2.addEventListener("click", () => {
                playRecordAudio(audio2);
                videoPopup.style.display = "block";
                videoPlayer.play().catch(err => {
                    console.error("视频播放失败：", err);
                    alert("视频播放失败，请检查文件路径或格式！");
                    videoPopup.style.display = "none";
                });
            });
            btn3.addEventListener("click", () => {
                playRecordAudio(audio3);
            });
        }

        // ===================== 初始化所有功能 =====================
        window.addEventListener("DOMContentLoaded", () => {
            initBgImages();
            startBgAutoPlay();
            initBgSwipe();
            initRecordAudios();
            initBgMusic();
            syncSliderThumb();
            speedSlider.addEventListener("input", syncSliderThumb);
            initButtons();
            initVideo();
            [...recordAudios, bgMusic].forEach((audio, index) => {
                audio.addEventListener("error", () => {
                    if (index < 3) {
                        alert(`录音${index+1}加载失败，请确认文件存在且格式为MP3/WAV！`);
                    } else {
                        alert("背景音乐加载失败，请确认文件存在且格式为MP3/WAV！");
                    }
                });
            });
        });
    </script>
</body>
</html>
